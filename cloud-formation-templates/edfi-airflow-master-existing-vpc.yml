AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  This template deploys Airflow for EdFi to an existing VPC  


Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: STOP - Have you added Parameter Store values?
        Parameters:
          - VerifyParamStore
      - Label:
          default: EdFi Airflow Environment Information
        Parameters:
          - EnvironmentSize
          - PostgresVersion
          - EnvLabel
          - SSLCertificateId
          - DomainName
          - UpdateRoute53
          - HostedZoneId
          - DatabasePassword
          - SSHCIDR
          - SSHGitHubKeys
          - S3SourceBucket
          - DeployS3Datalake
          - ExistingS3DatalakeBucketName
          - ProjectRepoName
      - Label:
          default: Provide Your Own Existing VPC Network Configuration
        Parameters:
          - AccountType
          - VPCID
          - PublicSubnet1ID
          - PublicSubnet2ID
          - PrivateSubnet1ID
          - PrivateSubnet2ID
      - Label:
          default: Amazon EC2 configuration
        Parameters:
          - KeyPairName
          - LatestAmiId
      - Label:
          default: REMINDER - Set this tag on the next screen
        Parameters:
          - TagReminder

    ParameterLabels:
      VerifyParamStore:
        default: /airflow/setup/git/account, /airflow/setup/git/token, /airflow/{EnvLabel}/dbt/profiles.yml
      VPCID:
        default: VPC ID
      PublicSubnet1ID:
        default: Public Subnet 1 ID
      PublicSubnet2ID:
        default: Public Subnet 2 ID
      PrivateSubnet1ID:
        default: Private Subnet 1 ID
      PrivateSubnet2ID:
        default: Private Subnet 2 ID
      PostgresVersion:
        default: PostgreSQL Version
      LatestAmiId:
        default: 'Latest AMI ID'
      EnvironmentSize:
        default: Select a sizing option based on anticipated levels of usage
      EnvLabel:
        default: Label your environment
      SSHCIDR:
        default: Network Address range (CIDR) to allow connections to the SSH server
      SSHGitHubKeys:
        default: GitHub user IDs authorized to SSH
      DomainName:
        default: Domain Name that matches the SSL certificate
      UpdateRoute53:
        default: Create a record in Route53 for this environment
      HostedZoneId:
        default: Route53 zone to create the record in
      DatabasePassword:
        default: A password for the database account
      SSLCertificateId:
        default: The AWS ARN of a SSL certificate ID
      KeyPairName:
        default: EC2 Key pair for the Airflow server
      S3SourceBucket:
        default: S3 Bucket containing install scripts
      DeployS3Datalake:
        default: Create datalake bucket in S3
      ExistingS3DatalakeBucketName:
        default: If no, Name of existing S3 datalake bucket
      ProjectRepoName:
        default: EdFi project-specific GitHub repo
      TagReminder:
        default: This tag is required to Allow the DE team access to manage this stack.
      AccountType:
        default: Shared Stadium AWS account, or private customer account?


Parameters:

  VerifyParamStore:
    Type: String
    AllowedValues:
      - 'yes'
      - 'no'
    Default: 'no'
    Description: Ensure these parameters exist before deploying this stack.

  EnvironmentSize:
    AllowedValues:
      - small
      - medium
      - large
      - xlarge
    Default: small
    Description: Select the size of the environment to launch.  Smaller is cheaper but less performant. 
    Type: String

  EnvLabel:
    Description: Provide a unique label for your environment to identify resources.  You cannot use an label name that is already in use. MUST INCLUDE EITHER "prod" OR "dev". Should also include partner acronym.  Must be lowercase.  ie. "gsn-prod"
    Type: String
    AllowedPattern: ^[a-z0-9-]*(prod|dev)[a-z0-9-]*$

  SSLCertificateId:
    Default: ''
    Description: The AWS ARN value of the SSL certificate in the AWS ACM service to use for
      the Airflow environment.  LEAVE BLANK for Stadium deploymnets.  Shared certificate will be used.
    Type: String

  DomainName:
    Description: The fully qualified domain name in a URL to be used for this Airflow
      environment (e.g. edfi-airflow.domain.com)
    Type: String

  UpdateRoute53:
    Description: If this domain is managed in Route53 is this AWS account, should CloudFormation create a record for this environment?
    Type: String
    AllowedValues:
     - 'yes'
     - 'no'
    Default: 'no'

  HostedZoneId:
    Description: If you answered yes to the question above, what is the name of the hosted zone to add the record to?
    Type: AWS::Route53::HostedZone::Id

  VPCID:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID to use.
    ConstraintDescription: You must select an existing VPC for this deployment

  PublicSubnet1ID:
    Type: AWS::EC2::Subnet::Id
    Description: The Subnet ID of a Public Subnet in one of the Availability Zones above
    ConstraintDescription: You must select an existing Public Subnet ID in the VPC selected for this deployment

  PublicSubnet2ID:
    Type: AWS::EC2::Subnet::Id
    Description: The Subnet ID of a Public Subnet in the other Availability Zone above
    ConstraintDescription: You must select an existing Public Subnet ID in the VPC selected for this deployment

  PrivateSubnet1ID:
    Type: AWS::EC2::Subnet::Id
    Description: The Subnet ID of a Private Subnet in one of the Availability Zones above
    ConstraintDescription: You must select an existing Private Subnet ID in the VPC selected for this deployment

  PrivateSubnet2ID:
    Type: AWS::EC2::Subnet::Id
    Description: The Subnet ID of a Private Subnet in the other Availability Zone above
    ConstraintDescription: You must select an existing Private Subnet ID in the VPC selected for this deployment

  SSHCIDR:
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
    Description: For security reasons we recomend that you only enable your office range of IPs for external access to SSH.  This
      should be a trusted network in CIDR form notation (X.X.X.X/X).  For Stadium, this value must be '10.76.0.0/15'.  For Private accounts,
      any valid CIDR range may be used.  The EA Office Public IP range is '172.102.6.120/29'
    Type: String
    Default: 10.76.0.0/15

  SSHGitHubKeys:
    Description: Space separated list of GitHub user IDs to add to .ssh/authorized_keys
    Type: String
    Default: 'ea-mtenhoor ejoranlienea jayckaiser'

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/focal/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: Unless advised, do not change this value

  PostgresVersion:
    Description: Version of PostgreSQL to deploy in RDS
    Type: String
    AllowedValues:
      - 'Eleven'
      - 'Twelve'
      - 'Thirteen'
    Default: 'Twelve'

  DatabasePassword:
    Description: Password for the Database administrator account. Must be at least
      8 characters containing letters, numbers, and symbols
    Type: String
    MinLength: '8'
    MaxLength: '32'
    NoEcho: 'true' 
    AllowedPattern: "[a-zA-Z0-9]{8,32}"

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: 'EC2 Key Pair to use with the Airflow server'

  S3SourceBucket:
    Type: String
    Description: Bucket containing the install scripts for EdFi Airflow
    AllowedPattern: ^edfi-airflow-.*$

  DeployS3Datalake:
    Type: String
    Description: This will toggle CloudFormation creation of an S3 bucket for the datalake
    AllowedValues:
      - 'Yes'
      - 'No'

  ExistingS3DatalakeBucketName:
    Type: String
    Description: Name of the existing S3 datalake bucket to use instead

  ProjectRepoName:
    Type: String
    Description: Name of the EdFi project-specific GitHub repository where project-level configs, DAGs, and init scripts are stored

  TagReminder:
    Type: String
    Default: "Key: edfi_airflow_access  Value: allow"

  AccountType:
    Type: String
    Default: "Stadium"
    AllowedValues:
      - "Stadium"
      - "Private"


Mappings: 
  PostgreSQLInformation:
    EngineVersion:
      "Eleven": "11.15"
      "Twelve": "12.10"
      "Thirteen": "13.6"
    ParameterGroupFamily:
      "Eleven": "postgres11"
      "Twelve": "postgres12"
      "Thirteen": "postgres13"
    EngineEdition:
      "Standard": "postgres"
    AccountInfo: 
      "DBUsername": "postgres"
    DBSize:
      "small": "db.t4g.micro"
      "medium": "db.t4g.micro"
      "large": "db.t4g.micro"
      "xlarge": "db.t4g.micro"
    AppServerSize:
      "small": "t3a.small"
      "medium": "t3a.medium"
      "large": "t3a.large"
      "xlarge": "m6i.xlarge"


Conditions:
  UpdateRoute53record: !Equals
    - !Ref UpdateRoute53
    - 'yes'

  IsStadiumAccount: !Equals
    - !Ref AccountType
    - 'Stadium'

  IsPrivateAccount: !Equals
    - !Ref AccountType
    - 'Private'

Rules:
  StadiumAccountSshRange: 
    RuleCondition: !Equals
      - !Ref AccountType
      - 'Stadium'
    Assertions:
      - Assert: !Equals
          - !Ref SSHCIDR
          - '10.76.0.0/15'
        AssertDescription: When AccountType is 'Stadium', SSHCIDR must be '10.76.0.0/15'
  
  StadiumAccountCertificate:
    RuleCondition: !Equals
      - !Ref AccountType
      - 'Stadium'
    Assertions:
      - Assert: !Equals
          - !Ref SSLCertificateId
          - ''
        AssertDescription: When AccountType is 'Stadium', SSLCertificateId must be blank.  If a certificate was created, delete it.  

Resources:
  LambdaStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/edfi-airflow-lambda-functions.yml'
      Parameters:
        S3BucketSourceCode: !Ref S3SourceBucket
        S3KeySourceCode: lambdas
        EnvLabel: !Ref 'EnvLabel'

  IamKmsSecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/edfi-airflow-iam-kms-security-groups.yml'
      Parameters:
        VPCID: !Ref 'VPCID'
        EnvLabel: !Ref 'EnvLabel'
        AccountType: !Ref 'AccountType'
        SSHCIDR: !Ref 'SSHCIDR'
        SSHGitHubKeys: !Ref 'SSHGitHubKeys'
        S3SourceBucket: !Ref 'S3SourceBucket'
        SsmParamStoreLambdaFunctionArn: !GetAtt 'LambdaStack.Outputs.SsmParamStoreLambdaFunctionArn'
        DeployS3Datalake: !Ref 'DeployS3Datalake'
        ExistingS3DatalakeBucketName: !Ref 'ExistingS3DatalakeBucketName'

  DatabaseStack:
    DependsOn: LambdaStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/edfi-airflow-rds.yml'
      Parameters:
        EnvLabel: !Ref 'EnvLabel'
        DBPassword: !Ref 'DatabasePassword'
        DBUsername: !FindInMap
          - PostgreSQLInformation
          - AccountInfo
          - DBUsername
        DBEngineVersion: !FindInMap
          - PostgreSQLInformation
          - EngineVersion
          - !Ref PostgresVersion
        DBInstanceClass: !FindInMap
          - PostgreSQLInformation
          - DBSize
          - !Ref EnvironmentSize
        ParameterGroupFamily: !FindInMap
          - PostgreSQLInformation
          - ParameterGroupFamily
          - !Ref PostgresVersion
        PrivateSubnet1ID: !Ref 'PrivateSubnet1ID'
        PrivateSubnet2ID: !Ref 'PrivateSubnet2ID'
        RDSSecurityGroupID: !GetAtt 'IamKmsSecurityGroupsStack.Outputs.RDSSecurityGroupID'
        VPCID: !Ref 'VPCID'
        VolumeSize: 20
        KmsKeyId: !GetAtt 'IamKmsSecurityGroupsStack.Outputs.KeyId'
        SsmParamStoreLambdaFunctionArn: !GetAtt 'LambdaStack.Outputs.SsmParamStoreLambdaFunctionArn'

  AirflowServerStack:
    DependsOn: DatabaseStack
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${S3SourceBucket}.s3.amazonaws.com/templates/edfi-airflow-server.yml'
      Parameters:
        EnvLabel: !Ref 'EnvLabel'
        AccountType: !Ref 'AccountType'
        PublicSubnet1ID: !Ref 'PublicSubnet1ID'
        PublicSubnet2ID: !Ref 'PublicSubnet2ID'
        PrivateSubnet1ID: !Ref 'PrivateSubnet1ID'
        PrivateSubnet2ID: !Ref 'PrivateSubnet2ID'
        VPCID: !Ref 'VPCID'
        InstanceType: !FindInMap
          - PostgreSQLInformation
          - AppServerSize
          - !Ref EnvironmentSize
        SecurityGroup: !GetAtt 'IamKmsSecurityGroupsStack.Outputs.AirflowServerSecurityGroupID'
        KeyPairName: !Ref 'KeyPairName'
        LatestAmiId: !Ref 'LatestAmiId'
        AirflowInstanceProfile: !GetAtt 'IamKmsSecurityGroupsStack.Outputs.AirflowServerIamProfileARN'
        SSLCertificateId: !Ref 'SSLCertificateId'
        S3SourceBucket: !Ref 'S3SourceBucket'
        ALBSecurityGroup: !If [IsPrivateAccount, !GetAtt 'IamKmsSecurityGroupsStack.Outputs.AirflowAppLoadBalancerSGID', '']
        RDSEndpoint: !GetAtt 'DatabaseStack.Outputs.RDSEndpoint'
        DatabasePassword: !Ref 'DatabasePassword'
        ProjectRepoName: !Ref 'ProjectRepoName'
        DomainName: !Ref 'DomainName'
        AirflowServerEipAddress: !If [IsPrivateAccount, !GetAtt 'IamKmsSecurityGroupsStack.Outputs.AirflowServerEipAddress', '']
        AirflowServerEipAllocationId: !If [IsPrivateAccount, !GetAtt 'IamKmsSecurityGroupsStack.Outputs.AirflowServerEipAllocationId', '']
        CloudwatchLogGroupARN: !GetAtt 'IamKmsSecurityGroupsStack.Outputs.CloudwatchLogGroupARN'
        KmsKeyId: !GetAtt 'IamKmsSecurityGroupsStack.Outputs.KeyId'
        EfsSecurityGroup: !GetAtt 'IamKmsSecurityGroupsStack.Outputs.AirflowEfsSecurityGroupId'
        AirflowInstanceRole: !GetAtt 'IamKmsSecurityGroupsStack.Outputs.AirflowServerIamRoleArn'
        
  Route53record:
    Condition: UpdateRoute53record
    DependsOn: AirflowServerStack
    Type: AWS::Route53::RecordSet
    Properties:
      Name: !Ref DomainName
      HostedZoneId: !Ref HostedZoneId
      Type: CNAME
      TTL: 900
      ResourceRecords: 
        - !If 
          - IsStadiumAccount
          - 'Stadium-Shared-ALB-1224147270.us-east-2.elb.amazonaws.com'
          - !GetAtt 'AirflowServerStack.Outputs.DNSName'


Outputs:
  WebApiDnsName:
    Condition: IsPrivateAccount
    Description: The DNS name of the Airflow LB that you should use to create a
      CNAME/ALIAS DNS record to point to your own Domain e.g. mysite.com
    Value: !GetAtt 'AirflowServerStack.Outputs.DNSName'
  WebApiProdURL:
    Description: The URL of the Airflow endpoint, after DNS is updated
    Value: !Sub 'https://${DomainName}'
  DatabaseEndpoint:
    Description: The Airflow Database endpoint
    Value: !GetAtt 'DatabaseStack.Outputs.RDSEndpoint'
  SshIpAddress:
    Description: IP address that can be used for SSH access to Airflow server.
    Value: !If
      - IsStadiumAccount
      - !GetAtt 'AirflowServerStack.Outputs.EniIp'
      - !GetAtt 'IamKmsSecurityGroupsStack.Outputs.AirflowServerEipAddress'
