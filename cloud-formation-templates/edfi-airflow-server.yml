AWSTemplateFormatVersion: 2010-09-09
Description: >-
  This template will deploy an autoscaling group and a single EC2 instance
  to act as an Airflow server.
  

Metadata:
  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: Network Configuration
        Parameters:
          - AccountType
          - VPCID
          - PublicSubnet1ID
          - PublicSubnet2ID
          - PrivateSubnet1ID
          - PrivateSubnet2ID
          - AirflowServerEipAddress
          - AirflowServerEipAllocationId
      - Label:
          default: Amazon EC2 Configuration
        Parameters:
          - KeyPairName
          - InstanceType
          - LatestAmiId
          - SecurityGroup
          - ALBSecurityGroup
          - AirflowInstanceProfile
          - EnvLabel
          - S3SourceBucket
          - SSLCertificateId
          - RDSEndpoint
          - DatabasePassword
          - ProjectRepoName
          - DomainName
          - CloudwatchLogGroupARN
      - Label:
          default: EFS Configuration
        Parameters:
          - KmsKeyId
          - EfsSecurityGroup
          - AirflowInstanceRole
    ParameterLabels:
      KeyPairName:
        default: Key Pair Name
      LatestAmiId:
        default: Latest AMI ID to be used to launch the EC2 instance
      PublicSubnet1ID:
        default: Public Subnet 1 ID
      PublicSubnet2ID:
        default: Public Subnet 2 ID
      PrivateSubnet1ID:
        default: Private Subnet 1 ID
      PrivateSubnet2ID:
        default: Private Subnet 2 ID
      AirflowServerEipAddress:
        default: Elastic IP address for the Airflow server
      AirflowServerEipAllocationId:
        default: Elastic IP allocation ID for the Airflow server
      InstanceType:
        default: EC2 Instance Type
      VPCID:
        default: VPC ID
      SecurityGroup:
        default: Existing Security Group ID
      ALBSecurityGroup:
        default: Existing Security Group ID
      AirflowInstanceProfile:
        default: IAM Role ARN for the EC2 instance
      EnvLabel:
        default: Label your environment
      S3SourceBucket:
        default: S3 bucket containing deployment artifacts
      SSLCertificateId:
        default: ARN of certificate in ACM
      RDSEndpoint:
        default: Hostname of the RDS postgres instance
      DatabasePassword:
        default: Password for the postgres user in RDS
      ProjectRepoName:
        default: EdFi project-specific GitHub repo
      DomainName:
        default: Domain Name that matches the SSL certificate
      CloudwatchLogGroupARN:
        default: ARN of the CloudWatch Log Group for Airflow remote logging
      KmsKeyId:
        default: EFS Encryption Key
      EfsSecurityGroup:
        default: EFS Security Group
      AirflowInstanceRole:
        default: Airflow EC2 IAM role ARN to allow access to EFS
      AccountType:
        default: Shared Stadium AWS account, or private customer account?

Parameters:
  EnvLabel:
    Default: ''
    Type: String
    Description: Provide a label for your environment to identify resources easier.
  KeyPairName:
    Description: >-
      Public/private key pairs allow you to securely connect to your instance
      after it launches
    Type: 'AWS::EC2::KeyPair::KeyName'
  LatestAmiId:
    Type: 'AWS::EC2::Image::Id'
    Default: ''
  SecurityGroup:
    Description: Airflow Server EC2 Security Group
    Type: 'AWS::EC2::SecurityGroup::Id'
  PublicSubnet1ID:
    Description: ID of public subnet 1 
    Type: 'AWS::EC2::Subnet::Id'
  PublicSubnet2ID:
    Description: ID of public subnet 2
    Type: 'AWS::EC2::Subnet::Id'
  PrivateSubnet1ID:
    Type: AWS::EC2::Subnet::Id
    Description: ID of private subnet 1
  PrivateSubnet2ID:
    Type: AWS::EC2::Subnet::Id
    Description: ID of private subnet 2
  AirflowServerEipAddress:
    Description: Elastic IP address for the Airflow server
    Type: String
  AirflowServerEipAllocationId:
    Description: Elastic IP allocation ID for the Airflow server
    Type: String
  InstanceType:
    Description: Amazon EC2 instance type for the SSH server instance
    Type: String
    Default: t3.micro
  VPCID:
    Description: 'ID of the VPC (e.g., vpc-0343606e)'
    Type: 'AWS::EC2::VPC::Id'
  AirflowInstanceProfile:
    Description: "IAM Instance Profile ARN for the Airflow EC2 instance"
    Type: String
  S3SourceBucket:
    Description: S3 bucket containing files to deploy
    Type: String
  ALBSecurityGroup:
    Description: Security Group ID for the Application Load Balancer
    Type: String
  SSLCertificateId:
    Description: Certificate for the ALB
    Type: String
  RDSEndpoint:
    Description: Hostname of the RDS endpoint
    Type: String
  DatabasePassword:
    Description: Password for the postgres user in RDS
    Type: String
    MinLength: '8'
    MaxLength: '32'
    NoEcho: 'true'
  ProjectRepoName:
    Type: String
    Description: Name of the EdFi project-specific GitHub repository where project-level configs, DAGs, and init scripts are stored
  DomainName:
    Type: String
    Description: The fully qualified domain name in a URL to be used for this Airflow
      environment (e.g. edfi-airflow.domain.com)
  CloudwatchLogGroupARN:
    Type: String
    Description: ARN of the CloudWatch Log Group for Airflow remote logging
  KmsKeyId:
    Description: KMS Key to encrypt the EFS File System
    Type: String
  EfsSecurityGroup:
    Description: Security Group ID for the EFS File System Mount Point
    Type: String
  AirflowInstanceRole:
    Description: ARN of the IAM Role for the Airflow EC2 instance
    Type: String
  AccountType:
    Description: Select Stadium if deploying to the Stadium AWS account.  Select Private if deploying to a customer specific AWS account.
    Type: String
    Default: "Stadium"
    AllowedValues:
      - "Stadium"
      - "Private"

Rules:
  SubnetsInVPC:
    Assertions:
      - Assert:
          'Fn::EachMemberIn':
            - 'Fn::ValueOfAll':
                - 'AWS::EC2::Subnet::Id'
                - VpcId
            - 'Fn::RefAll': 'AWS::EC2::VPC::Id'
        AssertDescription: All subnets must in the VPC

Conditions:
  IsStadiumAccount: !Equals
    - !Ref AccountType
    - 'Stadium'

  IsPrivateAccount: !Equals
    - !Ref AccountType
    - 'Private'

Resources:
  AirflowServerEni:
    Condition: IsStadiumAccount
    Type: AWS::EC2::NetworkInterface
    Properties: 
      Description: !Sub '${EnvLabel} Airflow ENI'
      GroupSet: 
        - !Ref SecurityGroup
      SubnetId: !Ref PrivateSubnet1ID

  AirflowEfsFileSystem:
    Type: AWS::EFS::FileSystem
    Properties: 
      BackupPolicy: 
        Status: ENABLED
      Encrypted: True
      FileSystemPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "elasticfilesystem:ClientMount"
              - "elasticfilesystem:ClientWrite"
              - "elasticfilesystem:ClientRootAccess"
            Principal:
                AWS: !Ref AirflowInstanceRole
            Condition:
              Bool:
                aws:SecureTransport: true
      FileSystemTags: 
        - Key: EnvLabel
          Value: !Ref EnvLabel
      KmsKeyId: !Ref KmsKeyId
      PerformanceMode: generalPurpose
  EfsMountTargetAz1:
    Type: AWS::EFS::MountTarget
    Properties: 
      FileSystemId: !Ref AirflowEfsFileSystem
      SecurityGroups: 
        - !Ref EfsSecurityGroup
      SubnetId: !If [IsStadiumAccount, !Ref PrivateSubnet1ID, !Ref PublicSubnet1ID]
  EfsMountTargetAz2:
    Type: AWS::EFS::MountTarget
    Properties: 
      FileSystemId: !Ref AirflowEfsFileSystem
      SecurityGroups: 
        - !Ref EfsSecurityGroup
      SubnetId: !If [IsStadiumAccount, !Ref PrivateSubnet2ID, !Ref PublicSubnet2ID]
  AirflowAutoScalingGroup:
    Type: 'AWS::AutoScaling::AutoScalingGroup'
    DependsOn:
      - EfsMountTargetAz1
      - EfsMountTargetAz2
    Properties:
      LaunchConfigurationName: !Ref AirflowLaunchConfiguration
      VPCZoneIdentifier: !If
        - IsStadiumAccount
        - - !Ref PrivateSubnet1ID
        - - !Ref PublicSubnet1ID
          - !Ref PublicSubnet2ID
      MinSize: 1
      MaxSize: 1
      Cooldown: '300'
      DesiredCapacity: 1
      TargetGroupARNs:
        - !Ref 'AirflowTargetGroup'
      Tags:
        - Key: Name
          Value: !Sub '${EnvLabel}-Airflow Server'
          PropagateAtLaunch: 'true'
        - Key: Environment
          Value: !Ref EnvLabel
          PropagateAtLaunch: 'true'

  AirflowLaunchConfiguration:
    Type: 'AWS::AutoScaling::LaunchConfiguration'
    Properties:
      AssociatePublicIpAddress: !If [IsStadiumAccount, 'false', 'true']
      ImageId: !Ref LatestAmiId
      SecurityGroups:
        - !Ref SecurityGroup
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: '12'
            VolumeType: gp2
            Encrypted: True
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref AirflowInstanceProfile
      UserData: 
        Fn::Base64: !Sub 
          - |
            #!/bin/bash
            echo Begin user data script
            echo CloudFormation-EnvLabel ${EnvLabel}
            apt-get update && apt-get install -y unzip
            cd /tmp
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            ./aws/install
            aws s3 cp s3://${S3SourceBucket}/scripts/${StaticIpScript} .
            aws s3 cp s3://${S3SourceBucket}/scripts/amazon-cloudwatch-agent.sh .
            aws s3 cp s3://${S3SourceBucket}/scripts/mount-efs.sh .
            aws s3 cp s3://${S3SourceBucket}/scripts/airflow-init.sh .
            aws s3 cp s3://${S3SourceBucket}/scripts/venv-airflow-init.sh .
            aws s3 cp s3://${S3SourceBucket}/scripts/venv-dbt-init.sh .
            chmod +x *.sh
            export S3SourceBucket=${S3SourceBucket}
            export ProjectRepoName=${ProjectRepoName}
            export DomainName=${DomainName}
            export EnvLabel=${EnvLabel}
            export CloudwatchLogGroupARN=${CloudwatchLogGroupARN}
            ${StaticIpCommand}
            ./mount-efs.sh ${AirflowEfsFileSystem}
            ./airflow-init.sh
            ./amazon-cloudwatch-agent.sh
          - StaticIpScript: !If [IsStadiumAccount, 'associate-elastic-network-interface.sh', 'associate-elastic-ip.sh']
            StaticIpCommand: !If
            - IsStadiumAccount
            - !Sub 
              - './associate-elastic-network-interface.sh ${AirflowServerEni} ${EniIp}'
              - EniIp: !GetAtt 'AirflowServerEni.PrimaryPrivateIpAddress'
            - !Sub './associate-elastic-ip.sh ${AirflowServerEipAddress} ${AirflowServerEipAllocationId} ${AWS::Region}'

  AirflowLoadBalancer:
    Condition: IsPrivateAccount
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties: 
      IpAddressType: ipv4
      Name: !Sub 'AirflowLB-${EnvLabel}'
      Scheme: internet-facing
      SecurityGroups: 
        - !Ref ALBSecurityGroup
      Subnets: 
        - !Ref PublicSubnet1ID
        - !Ref PublicSubnet2ID
      Type: application

  AirflowTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /health
      Name: !Sub 'AirflowTG-${EnvLabel}'
      Port: 8080
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref 'VPCID'

  AirflowListenerRule:
    Condition: IsStadiumAccount
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions: 
        - Type: forward
          TargetGroupArn: !Ref AirflowTargetGroup
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref DomainName
      ListenerArn: arn:aws:elasticloadbalancing:us-east-2:266746307911:listener/app/Stadium-Shared-ALB/4125a4aaee8349ff/901a06bbb55982bf
      Priority: !Select ['3', !Split ['.', !GetAtt 'AirflowServerEni.PrimaryPrivateIpAddress']]

  AirflowALBHTTPSListener:
    Condition: IsPrivateAccount
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref 'AirflowTargetGroup'
      LoadBalancerArn: !Ref 'AirflowLoadBalancer'
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref 'SSLCertificateId'
      SslPolicy: ELBSecurityPolicy-FS-1-2-Res-2020-10

  AirflowALBHTTPListener:
    Condition: IsPrivateAccount
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: redirect
          RedirectConfig: 
            Protocol: 'HTTPS'
            Port: '443'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: 'HTTP_301'
      LoadBalancerArn: !Ref 'AirflowLoadBalancer'
      Port: 80
      Protocol: HTTP


Outputs:
  DNSName:
    Condition: IsPrivateAccount
    Description: 'DNS name of the load balancer'
    Value: !GetAtt 'AirflowLoadBalancer.DNSName'
  EniIp:
    Condition: IsStadiumAccount
    Description: 'Internal IP address of the Elastic Network Interface.'
    Value: !GetAtt 'AirflowServerEni.PrimaryPrivateIpAddress'
