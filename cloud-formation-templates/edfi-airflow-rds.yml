AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  This template deploys a RDS Postgres Server into an existing VPC for Airflow.
  

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network configuration
        Parameters:
          - VPCID
          - PrivateSubnet1ID
          - PrivateSubnet2ID
          - RDSSecurityGroupID
      - Label:
          default: RDS Server configuration
        Parameters:
          - EnvLabel
          - DBInstanceClass
          - SQLEngineEdition
          - DBEngineVersion
          - RDSOptionGroup
          - DBUsername
          - DBPassword
          - VolumeSize
    ParameterLabels:
      EnvLabel:
        default: Label your environment
      DBInstanceClass:
        default: The instance size of the RDS
      SQLEngineEdition:
        default: RDS database engine
      DBEngineVersion:
        default: RDS database engine version
      DBUsername:
        default: Database user name
      DBPassword:
        default: Database password
      RDSOptionGroup:
        default: RDS Option Group
      PrivateSubnet1ID:
        default: Private subnet 1 ID
      PrivateSubnet2ID:
        default: Private subnet 2 ID
      VolumeSize:
        default: Data volume size
      VPCID:
        default: VPC ID
      RDSSecurityGroupID:
        default: RDS Security Group ID


Parameters:
  EnvLabel:
    Default: test
    Description: Provide a label for your environment to identify resources easier.
    Type: String
  PrivateSubnet1ID:
    Description: ID of the private subnet 1 in Availability Zone 1 (e.g., subnet-a0246dcd)
    Type: AWS::EC2::Subnet::Id
  PrivateSubnet2ID:
    Description: ID of the private subnet 2 in Availability Zone 2 (e.g., subnet-a0246dcd)
    Type: AWS::EC2::Subnet::Id
  DBInstanceClass:
    Default: db.t4g.micro
    Description: The name of the compute and memory capacity class of the database
      instance.
    Type: String
  SQLEngineEdition:
    Default: postgres
    Description: RDS Database Engine.
    Type: String
  DBEngineVersion:
    Description: Postgres Database Engine Version.
    Type: String
  DBUsername:
    AllowedPattern: '[a-zA-Z0-9]*'
    Default: postgres
    Description: RDS master user name.
    MaxLength: '25'
    MinLength: '5'
    Type: String
  DBPassword:
    Description: Password for the SQL master user. Must be at least 8 characters containing
      letters, numbers and symbols
    MaxLength: '32'
    MinLength: '8'
    NoEcho: 'true'
    Type: String
  RDSOptionGroup:
    Description: RDS Option Group to apply
    Type: String
    Default: 'none'
  ParameterGroupFamily:
    Description: Parameter Group Family Name
    Type: String
    Default: 'postgres12'
  VolumeSize:
    Default: '20'
    Description: Volume size for the databse volume, in GiB
    MaxValue: '100'
    MinValue: '20'
    Type: Number
  VPCID:
    Description: ID of the VPC (e.g., vpc-0343606e)
    Type: AWS::EC2::VPC::Id
  RDSSecurityGroupID:
    Description: Security Group ID to use with this RDS (e.g., sg-7f16e910).
    Type: AWS::EC2::SecurityGroup::Id
  KmsKeyId:
    Description: KMS Key to encrypt the password with in Parameter Store
    Type: String
  SsmParamStoreLambdaFunctionArn:
    Description: ARN of Lambda function for storing secure strings in parameter store
    Type: String


Rules:
  SubnetsInVPC:
    Assertions:
      - Assert: !EachMemberIn
          - !ValueOfAll
            - AWS::EC2::Subnet::Id
            - VpcId
          - !RefAll 'AWS::EC2::VPC::Id'
        AssertDescription: All subnets must in the VPC


Conditions:  
   NoOptionGroupName: !Equals
     - !Ref 'RDSOptionGroup'
     - 'none' 
   UsePostgres: !Equals
     - !Ref 'SQLEngineEdition'
     - 'postgres'


Resources:
  AirflowRDSPasswordResource:
    Type: Custom::ManagedPassword
    Properties:
      ServiceToken: !Ref 'SsmParamStoreLambdaFunctionArn'
      region: !Ref 'AWS::Region'
      keyid: !Ref 'KmsKeyId'
      name: !Sub '/airflow/${EnvLabel}/rds/password'
      value: !Ref 'DBPassword'

  AirflowRDSEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Name: !Sub '/airflow/${EnvLabel}/rds/endpoint'
      Type: String
      Value: !GetAtt 'RDSDatabaseInstance.Endpoint.Address'

  AirflowRDSPortParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Name: !Sub '/airflow/${EnvLabel}/rds/port'
      Type: String
      Value: !GetAtt 'RDSDatabaseInstance.Endpoint.Port'

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub 'Airflow RDS Subnet Group for ${AWS::StackName}
        RDS SQL'
      DBSubnetGroupName: !Sub '${AWS::StackName}-DBSubnetGroup'
      SubnetIds:
        - !Ref 'PrivateSubnet1ID'
        - !Ref 'PrivateSubnet2ID'

  RDSParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Sub 'Airflow RDS Parameter Group for ${AWS::StackName}'
      Family: !Ref ParameterGroupFamily
      Parameters:
        rds.force_ssl: 1
      Tags:
        - Key: Name
          Value: !Sub 'Airflow Postgres Parameter Group ${EnvLabel}'
        - Key: Environment
          Value: !Ref 'EnvLabel'

  RDSDatabaseInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub 'EdFi-Airflow-${EnvLabel}'
      AutoMinorVersionUpgrade: 'true'
      AllocatedStorage: !Ref 'VolumeSize'
      BackupRetentionPeriod: 7
      DBInstanceClass: !Ref 'DBInstanceClass'
      StorageType: 'gp2'
      DBSubnetGroupName: !Ref 'DBSubnetGroup'
      OptionGroupName: !If [NoOptionGroupName, !Ref 'AWS::NoValue', !Ref 'RDSOptionGroup']
      DBParameterGroupName: !Ref RDSParameterGroup
      Engine: !Ref 'SQLEngineEdition'
      EngineVersion: !Ref 'DBEngineVersion'
      LicenseModel: !If [UsePostgres, 'postgresql-license', 'license-included']
      MasterUserPassword: !Ref 'DBPassword'
      MasterUsername: !Ref 'DBUsername'
      MultiAZ: 'false'
      VPCSecurityGroups:
        - !Ref 'RDSSecurityGroupID'
      PubliclyAccessible: 'false'
      StorageEncrypted: 'true'
      Tags:
        - Key: Name
          Value: !Sub 'Airflow-Database-Server-${EnvLabel}'
        - Key: Environment
          Value: !Ref 'EnvLabel'


Outputs:
  RDSEndpoint:
    Description: Database endpoint
    Value: !Sub '${RDSDatabaseInstance.Endpoint.Address}'
    Export:
      Name: !Sub '${AWS::StackName}-RDSSQLEndpoint'
  RDSName:
    Description: 'RDS AWS Name'
    Value: !Ref 'RDSDatabaseInstance'
    Export:
      Name: !Sub '${AWS::StackName}-RDSName'
