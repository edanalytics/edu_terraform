AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  This template creates the required Security Groups, IAM requirements, and RDS parameter
  groups for the Ed-Fi Airflow. 
  

Parameters:
  EnvLabel:
    Default: test
    Type: String
    Description: Provide a label for your environment to identify resources easier.
  VPCID:
    Default: ''
    Type: AWS::EC2::VPC::Id
    Description: VPC ID to create the security groups within the network
  SSHCIDR:
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
    Description: Allowed CIDR Block for external access to the Remote Desktop Gateways.  This
      should be a trusted network.
    Type: String
    Default: '0.0.0.0/0'
  SSHGitHubKeys:
    Description: Space separated list of GitHub user IDs to add to .ssh/authorized_keys
    Type: String
  S3SourceBucket:
    Description: S3 Bucket containing source files
    Type: String
  SsmParamStoreLambdaFunctionArn:
    Description: ARN of Lambda function for storing secure strings in parameter store
    Type: String
  DeployS3Datalake:
    Type: String
    Description: This will toggle CloudFormation creation of an S3 bucket for the datalake
    AllowedValues:
      - 'Yes'
      - 'No'
  ExistingS3DatalakeBucketName:
    Type: String
    Description: Name of the existing S3 datalake bucket to use instead
  AccountType:
    Description: Select Stadium if deploying to the Stadium AWS account.  Select Private if deploying to a customer specific AWS account.
    Type: String
    Default: "Stadium"
    AllowedValues:
      - "Stadium"
      - "Private"


Conditions:
  DeployS3DatalakeBucket: !Equals
    - !Ref DeployS3Datalake
    - 'Yes'

  IsStadiumAccount: !Equals
    - !Ref AccountType
    - 'Stadium'

  IsPrivateAccount: !Equals
    - !Ref AccountType
    - 'Private'

Resources:
  SSHGitHubKeysParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/airflow/${EnvLabel}/ssh/authorized_github_users'
      Value: !Ref 'SSHGitHubKeys'
      Type: String

  S3DataLakeBucket:
    Condition: DeployS3DatalakeBucket
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'edfi-airflow-${EnvLabel}-datalake'
      BucketEncryption: 
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt 'KMSKey.Arn'
      LifecycleConfiguration:
        Rules:
          - Id: IntelligentTiering
            Status: Enabled
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  S3DataLakeBucketParameter:
    Type: AWS::SSM::Parameter
    Properties: 
      Name: !Sub '/airflow/${EnvLabel}/s3/bucket'
      Type: String
      Value: !If [DeployS3DatalakeBucket, !Ref 'S3DataLakeBucket', !Ref 'ExistingS3DatalakeBucketName']

  SnowflakeIamUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 
        - '${S3DataLakeBucketName}-snowflake-ReadOnly'
        - S3DataLakeBucketName: !If [DeployS3DatalakeBucket, !Ref 'S3DataLakeBucket', !Ref 'ExistingS3DatalakeBucketName']
      Policies:
        - PolicyName: 'AllowAccess'
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 
                    - 'arn:aws:s3:::${S3DataLakeBucketName}'
                    - S3DataLakeBucketName: !If [DeployS3DatalakeBucket, !Ref 'S3DataLakeBucket', !Ref 'ExistingS3DatalakeBucketName']
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 
                    - 'arn:aws:s3:::${S3DataLakeBucketName}/*'
                    - S3DataLakeBucketName: !If [DeployS3DatalakeBucket, !Ref 'S3DataLakeBucket', !Ref 'ExistingS3DatalakeBucketName']

  SnowflakeS3AccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      Status: Active
      UserName: !Ref 'SnowflakeIamUser'

  SnowflakeS3KeyResource:
    Type: Custom::ManagedPassword
    Properties:
      ServiceToken: !Ref 'SsmParamStoreLambdaFunctionArn'
      region: !Ref 'AWS::Region'
      keyid: !Ref 'KMSKey'
      name: !Sub '/airflow/${EnvLabel}/s3/snowflake/key'
      value: !Ref 'SnowflakeS3AccessKey'

  SnowflakeS3SecretResource:
    Type: Custom::ManagedPassword
    Properties:
      ServiceToken: !Ref 'SsmParamStoreLambdaFunctionArn'
      region: !Ref 'AWS::Region'
      keyid: !Ref 'KMSKey'
      name: !Sub '/airflow/${EnvLabel}/s3/snowflake/secret'
      value: !GetAtt 'SnowflakeS3AccessKey.SecretAccessKey'

  KMSKey:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'KMS key for Ed-Fi Airflow ${EnvLabel} Environment ${AWS::StackName}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: !Sub 'edfi-airflow-kms-key-${EnvLabel}'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
      KeyUsage: ENCRYPT_DECRYPT
      Tags:
        - Key: edfi_airflow_access
          Value: allow

  KeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/edfi-airflow-kms-key-${EnvLabel}'
      TargetKeyId: !Ref 'KMSKey'
      
  AirflowEfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Airflow Elastic File System Security Group for the ${VPCID} vpc'
      GroupName: !Sub 'edfi-airflow-efs-${EnvLabel}-environment'
      VpcId: !Ref 'VPCID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref 'AirflowServerSecurityGroup'
          Description: 'Allow NFS from Airflow server to EFS'

  AirflowServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'airflow-server-${EnvLabel}'
      GroupDescription: !Sub 'Rules to allow access to Airflow server for the ${EnvLabel} environment'
      VpcId: !Ref 'VPCID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: !Ref 'SSHCIDR'
          Description: !Sub 'Allow SSH access to ${EnvLabel} environment Airflow server'
        - IpProtocol: tcp
          FromPort: '8080'
          ToPort: '8080'
          SourceSecurityGroupId: !If
            - IsPrivateAccount
            - !GetAtt 'AirflowAppLoadBalancerSG.GroupId'
            - 'sg-0aeae785ceaba323e'
          Description: Allow access to Airflow from Load Balancer

  AirflowServerEip:
    Condition: IsPrivateAccount
    Type: 'AWS::EC2::EIP'
    Properties:
      Domain: vpc

  AirflowServerIamInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
       - !Ref 'AirflowServerIamRole'

  AirflowServerIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonElasticFileSystemsUtils
      Policies:
        - PolicyName: AirflowAllowActions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::${S3SourceBucket}'
                  - !Sub 
                    - 'arn:aws:s3:::${S3DataLakeBucketName}'
                    - S3DataLakeBucketName: !If [DeployS3DatalakeBucket, !Ref 'S3DataLakeBucket', !Ref 'ExistingS3DatalakeBucketName']
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListMultipartUploadParts
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub 'arn:aws:s3:::${S3SourceBucket}/*'
                  - !Sub 
                    - 'arn:aws:s3:::${S3DataLakeBucketName}/*'
                    - S3DataLakeBucketName: !If [DeployS3DatalakeBucket, !Ref 'S3DataLakeBucket', !Ref 'ExistingS3DatalakeBucketName']
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:LabelParameterVersion
                  - ssm:DeleteParameter
                  - ssm:GetParameterHistory
                  - ssm:GetParametersByPath 
                  - ssm:GetParameters
                  - ssm:GetParameter
                  - ssm:DeleteParameters
                Resource:
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:*'
              - Effect: Allow
                Action: 
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey
                Resource:
                  - !GetAtt 'KMSKey.Arn'
              - Effect: Allow
                Action:
                  - ec2:DisassociateAddress
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:*/*'
              - !If
                - IsStadiumAccount
                - Effect: Allow
                  Action:
                    - ec2:AttachNetworkInterface
                  Resource:
                    - '*'
                - Effect: Allow
                  Action:
                    - ec2:AssociateAddress
                  Resource:
                    - !Sub 
                      - 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/${allocationId}'
                      - allocationId: !GetAtt 'AirflowServerEip.AllocationId'
                    - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
              - Effect: Allow
                Action:
                  - logs:*
                Resource:
                  - !GetAtt 'CloudwatchLogGroup.Arn'

  AirflowAppLoadBalancerSG:
    Condition: IsPrivateAccount
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Airflow Load Balancer Security Group for the ${VPCID} vpc'
      GroupName: !Sub 'edfi-airflow-load-balancer-${EnvLabel}-environment'
      VpcId: !Ref 'VPCID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref 'SSHCIDR'
          Description: 'Allow HTTP to LoadBalancer'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref 'SSHCIDR'
          Description: 'Allow HTTPS to LoadBalancer'

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'airflow-rds-${EnvLabel}-database'
      GroupDescription: !Sub 'Rules to allow access to edfi airflow RDS system in the ${EnvLabel} environment'
      VpcId: !Ref 'VPCID'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '5432'
          ToPort: '5432'
          SourceSecurityGroupId: !Ref 'AirflowServerSecurityGroup'
          Description: !Sub 'Allow access from the ${EnvLabel} environment Airflow instances'

  CloudwatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub 'edfi-airflow-remote-logging-${EnvLabel}'

Outputs:
  AirflowServerEipAddress:
    Condition: IsPrivateAccount
    Description: Elastic IP address for the Airflow server
    Value: !Ref 'AirflowServerEip'
    Export:
      Name: !Sub '${AWS::StackName}-AirflowServerEipAddress'
  AirflowServerEipAllocationId:
    Condition: IsPrivateAccount
    Description: Elastic IP allocation ID for the Airflow server
    Value: !GetAtt 'AirflowServerEip.AllocationId'
    Export: 
      Name: !Sub '${AWS::StackName}-AirflowServerAllocationId'
  AirflowServerSecurityGroupID:
    Description: Security Group IP for the Airflow Server
    Value: !Ref 'AirflowServerSecurityGroup'
    Export:
      Name: !Sub '${AWS::StackName}-AirflowServerSecurityGroupID'
  AirflowServerIamProfileARN:
    Description: ARN of the IAM Instance Profile for the Airflow EC2 instance
    Value: !GetAtt 'AirflowServerIamInstanceProfile.Arn'
    Export:
      Name: !Sub '${AWS::StackName}-AirflowServerIamProfileARN'
  AirflowServerIamRoleArn:
    Description: ARN of the IAM Role for the Airflow EC2 instance
    Value: !GetAtt 'AirflowServerIamRole.Arn'
    Export:
      Name: !Sub '${AWS::StackName}-AirflowServerIamRoleArn'
  AirflowAppLoadBalancerSGID:
    Condition: IsPrivateAccount
    Description: Security Group ID for the Airflow Load Balancer in this VPC
    Value: !Ref 'AirflowAppLoadBalancerSG'
    Export:
      Name: !Sub '${AWS::StackName}-AirflowAppLoadBalancerSGID'
  CloudwatchLogGroupARN:
    Description: ARN of the CloudWatch Log Group for Airflow remote logging
    Value: !GetAtt 'CloudwatchLogGroup.Arn'
    Export:
      Name: !Sub '${AWS::StackName}-CloudwatchLogGroupARN'
  KeyId:
    Description: KMS Key ID
    Value: !Ref 'KMSKey'
    Export:
      Name: !Sub '${AWS::StackName}-KeyId'
  KeyArn:
    Description: Key ARN.
    Value: !GetAtt 'KMSKey.Arn'
    Export:
      Name: !Sub '${AWS::StackName}-KeyArn'
  RDSSecurityGroupID:
    Description: Security Group ID for the RDS
    Value: !Ref 'RDSSecurityGroup'
    Export:
      Name: !Sub '${AWS::StackName}-RDSSecurityGroupID'
  AirflowEfsSecurityGroupId:
    Description: Security Group ID for the EFS
    Value: !Ref AirflowEfsSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-AirflowEfsSecurityGroupId'
