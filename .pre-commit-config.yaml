repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6   # run `pre-commit autoupdate` to pin the current tag
    hooks:
      - id: insert-license
        name: Add license header (TF)
        files: \.tf$
        args:
          - --license-filepath
          - LICENSE_HEADER.txt
          - --comment-style=#
